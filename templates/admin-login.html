{% extends "base.html" %}

{% block title %}Admin Login | TECHNISERVE{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}

{% block content %}
<section class="admin-login-section">
    <div class="admin-login-card">
        <div class="admin-login-header">
            <div class="admin-logo">
                <i data-lucide="shield-check"></i>
            </div>
            <h1>Admin Access</h1>
            <p>Restricted area — authorized personnel only</p>
        </div>

        <form id="adminLoginForm" class="admin-login-form">
            <div class="form-group">
                <label for="adminEmail">Admin Email</label>
                <div class="input-with-icon">
                    <i data-lucide="mail" class="input-icon"></i>
                    <input type="email" id="adminEmail" placeholder="admin@techniserve.com.ng" required>
                </div>
            </div>

            <div class="form-group">
                <label for="adminPassword">Password</label>
                <div class="input-with-icon">
                    <i data-lucide="lock" class="input-icon"></i>
                    <input type="password" id="adminPassword" placeholder="Enter admin password" required>
                </div>
            </div>

            <button type="submit" class="btn-admin-login">
                <span class="btn-text">Access Dashboard</span>
                <span class="btn-loader" style="display:none;">
                    <div class="spinner-small"></div>
                </span>
                <i data-lucide="arrow-right" class="btn-icon"></i>
            </button>

            <div class="admin-security-note">
                <i data-lucide="alert-triangle"></i>
                <span>All admin actions are logged and monitored.</span>
            </div>
        </form>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/admin-login.js') }}"></script>
{% endblock %}
