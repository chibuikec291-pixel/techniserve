<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Dashboard | TECHNISERVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0F172A; color: #F8FAFC; margin: 0; }
        .dash-header { background: #1E293B; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-size: 1.25rem; font-weight: 800; color: white; text-decoration: none; }
        .logo span { color: #2563EB; }
        .logout-btn { background: rgba(239, 68, 68, 0.1); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.2); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .dash-container { max-width: 1000px; margin: 0 auto; padding: 40px 24px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #1E293B; padding: 24px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .stat-card h3 { margin: 0; font-size: 2rem; font-weight: 800; color: #2563EB; }
        .stat-card p { margin: 8px 0 0 0; color: #94A3B8; font-size: 0.875rem; }
        .activity-section { margin-bottom: 40px; }
        .activity-list { background: #1E293B; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }
        .activity-item { padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        .activity-item:last-child { border-bottom: none; }
        .activity-item h4 { margin: 0 0 4px 0; font-size: 1rem; }
        .activity-item p { margin: 0; color: #94A3B8; font-size: 0.875rem; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: capitalize; background: rgba(59, 130, 246, 0.1); color: #3B82F6; }
        .empty-state { padding: 40px; text-align: center; color: #64748B; }
    </style>
</head>
<body>
    <header class="dash-header">
        <a href="/" class="logo">TECHNI<span>SERVE</span></a>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </header>

    <div class="dash-container">
        <h1 style="margin-bottom: 8px;">Welcome, <span id="clientName">Client</span>! 👋</h1>
        <p style="color: #94A3B8; margin-bottom: 32px;">Here is an overview of your projects.</p>

        <div class="stats-grid">
            <div class="stat-card"><h3 id="jobCount">0</h3><p>Posted Jobs</p></div>
            <div class="stat-card"><h3 id="bookingCount">0</h3><p>Active Bookings</p></div>
            <div class="stat-card"><h3 id="contractCount">0</h3><p>Contracts</p></div>
        </div>

        <div class="activity-section">
            <h2 style="font-size: 1.25rem; margin-bottom: 16px;">Recent Bookings</h2>
            <div class="activity-list" id="bookingsList"><div class="empty-state">Loading...</div></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/alert.js') }}"></script>
    <script>
        lucide.createIcons();

        async function loadDashboard() {
            try {
                const response = await fetch('/api/client/data');
                if (!response.ok) throw new Error('Unauthorized');
                const data = await response.json();
                
                document.getElementById('clientName').innerText = data.user.name;
                document.getElementById('jobCount').innerText = data.jobs.length;
                document.getElementById('bookingCount').innerText = data.bookings.length;
                document.getElementById('contractCount').innerText = data.contracts.length;

                const list = document.getElementById('bookingsList');
                if (data.bookings.length === 0) {
                    list.innerHTML = '<div class="empty-state">No bookings yet.</div>';
                } else {
                    list.innerHTML = data.bookings.map(b => `
                        <div class="activity-item">
                            <div><h4>${b.service}</h4><p>Technician: ${b.technician} • ${b.date}</p></div>
                            <span class="status-badge">${b.status}</span>
                        </div>
                    `).join('');
                }
            } catch (error) {
                window.location.href = '/login';
            }
        }

        async function logout() {
            await fetch('/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        loadDashboard();
    </script>
</body>
</html>
