<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Sign Up | TECHNISERVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); color: #F8FAFC; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .auth-container { background: rgba(30, 41, 59, 0.95); padding: 40px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); }
        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-header h1 { font-size: 1.75rem; font-weight: 800; margin: 0 0 8px 0; background: linear-gradient(135deg, #2563EB 0%, #10B981 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .auth-header p { color: #94A3B8; font-size: 0.95rem; margin: 0; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; color: #CBD5E1; }
        .form-group input { width: 100%; padding: 12px 16px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(51, 65, 85, 0.5); border-radius: 8px; color: #F8FAFC; font-family: inherit; font-size: 0.95rem; box-sizing: border-box; transition: all 0.2s; }
        .form-group input:focus { outline: none; border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, #2563EB 0%, #10B981 100%); color: white; border: none; border-radius: 8px; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .auth-footer { text-align: center; margin-top: 24px; font-size: 0.9rem; color: #94A3B8; }
        .auth-footer a { color: #2563EB; text-decoration: none; font-weight: 600; }
        
        /* Alert System CSS */
        #customAlert { display: none !important; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        #customAlert.active { display: flex !important; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .alert-progress.success { background: #10B981; animation: shrink 4s linear forwards; }
        .alert-progress.warning { background: #F59E0B; animation: shrink 4s linear forwards; }
        .alert-progress.error { background: #EF4444; animation: shrink 5s linear forwards; }
        @keyframes shrink { from { width: 100%; } to { width: 0%; } }
        .alert-icon.success { color: #10B981; } .alert-icon.warning { color: #F59E0B; } .alert-icon.error { color: #EF4444; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Create Client Account</h1>
            <p>Book verified professionals for your projects.</p>
        </div>
        <form id="clientSignupForm">
            <div class="form-group"><label>Full Name</label><input type="text" id="fullName" required placeholder="John Doe"></div>
            <div class="form-group"><label>Email Address</label><input type="email" id="email" required placeholder="john@example.com"></div>
            <div class="form-group"><label>Phone Number</label><input type="tel" id="phone" required placeholder="08012345678"></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" required placeholder="Min. 6 characters" minlength="6"></div>
            <button type="submit" class="btn-primary" id="submitBtn">Create Account</button>
        </form>
        <div class="auth-footer">Already have an account? <a href="/login">Log In</a></div>
    </div>

    <!-- EXACT HTML STRUCTURE REQUIRED BY alert.js -->
    <div id="customAlert">
        <div style="background: #1E293B; padding: 32px; border-radius: 16px; max-width: 400px; width: 90%; text-align: center; border: 1px solid rgba(255,255,255,0.1); position: relative; overflow: hidden;">
            <div id="alertIcon" class="alert-icon" style="font-size: 3rem; margin-bottom: 16px;"></div>
            <h3 id="alertTitle" style="margin: 0 0 12px 0; font-size: 1.25rem; font-weight: 700; color: #F8FAFC;"></h3>
            <p id="alertMessage" style="margin: 0 0 24px 0; color: #94A3B8; font-size: 0.95rem;"></p>
            <button id="alertClose" style="background: #2563EB; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%;">Okay</button>
            <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.1);">
                <div id="alertProgress" class="alert-progress"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/alert.js') }}"></script>
    <script>
        document.getElementById('clientSignupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = 'Creating Account...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/client/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fullName: document.getElementById('fullName').value.trim(),
                        email: document.getElementById('email').value.trim(),
                        phone: document.getElementById('phone').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const data = await response.json();

                if (data.success) {
                    showSuccess('Account created! Redirecting...', 'Success');
                    setTimeout(() => { window.location.href = data.redirect; }, 1500);
                } else {
                    showWarning(data.message || 'Registration failed', 'Warning');
                    submitBtn.innerText = 'Create Account';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                showError('Network error. Please try again.', 'Error');
                submitBtn.innerText = 'Create Account';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
